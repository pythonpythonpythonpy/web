<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8">
		<title>智能头盔管理平台</title>
		<link rel="stylesheet" href="./css/style.css">
	</head>

	<body>
		<div>
			<img src="./file/title.jpg" alt="智能头盔管理平台">
		</div>
		<div class="box">
			<div class="map">
				<img src="http://api.tianditu.gov.cn/staticimage?
					center=116.40,39.93
					&width=1000
					&height=590
					&zoom=12
					&layers=vec_c,cva_c
					&markers=116.34867,39.94593
					&tk=be0a7553c81927d557b83f4690dd33f7" alt="地图">
			</div>
			<div class="card-father">
				<div class="card">
					<h1 class="card-title">骑行状态</h1>
				</div>
				<div class="card">
					<h1 class="card-title">当前位置</h1>
				</div>
				<div class="card">
					<h1 class="card-title">原始数据</h1>
					<!-- 账号密码已写死在 js/main.js 的 MQTT_CONFIG 里，打开页面自动连接 -->
					<div class="mqtt-bar">
						<button id="mqtt-connect" type="button">连接</button>
					</div>
					<div class="mqtt-status" id="mqtt-status">未连接</div>
					<!-- 所有订阅到的消息都会实时追加到这个框里 -->
					<div class="raw-data" id="raw-data"></div>
				</div>
			</div>
		</div>

		<!-- MQTT.js：浏览器端通过 WebSocket 连接 MQTT 服务器 -->
		<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
		<script src="./js/main.js"></script>
	</body>
</html>
