<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>智能头盔管理平台</title>
		<link rel="stylesheet" href="./css/style.css">
	</head>

	<body>
		<h1 class="page-title">
			<img src="./file/title.jpg" alt="智能头盔管理平台">
		</h1>

		<!-- 缺少配置时显示提示，内容由 js/main.js 填充 -->
		<div id="config-hint" class="config-hint" hidden></div>

		<main class="box">
			<section class="map">
				<!-- 地图地址由 js/update.js 根据 config.json 拼出来，不再写死在 HTML 里 -->
				<img id="map-image" alt="头盔当前位置地图" hidden>
				<p id="map-hint" class="map-hint">地图加载中…</p>
			</section>

			<div class="card-father">
				<section class="card">
					<h2 class="card-title">骑行状态</h2>
					<div class="status-grid">
						<div class="status-cell">
							<span id="helmet-status" class="dot"></span>
							<span id="helmet-text" class="status-value">在线</span>
						</div>
						<div class="status-cell">
							<span id="ride-status" class="dot"></span>
							<span id="ride-text" class="status-value">安全</span>
						</div>
						<div class="status-cell status-cell--label">头盔状态</div>
						<div class="status-cell status-cell--label">骑行状态</div>
					</div>
				</section>

				<section class="card">
					<h2 class="card-title">当前位置</h2>
					<div class="gps-row">
						<span class="gps-label">经度:</span>
						<span id="longitude-text" class="gps-value">112.5</span>
					</div>
					<div class="gps-row">
						<span class="gps-label">纬度:</span>
						<span id="latitude-text" class="gps-value">23.5</span>
					</div>
				</section>

				<section class="card">
					<h2 class="card-title">原始数据</h2>
					<div class="mqtt-bar">
						<button id="mqtt-connect" type="button">连接</button>
					</div>
					<div class="mqtt-status" id="mqtt-status">未连接</div>
					<!-- 所有订阅到的消息都会实时追加到这个框里 -->
					<div class="raw-data" id="raw-data"></div>
				</section>
			</div>
		</main>

		<!-- MQTT.js：浏览器端通过 WebSocket 连接 MQTT 服务器 -->
		<script src="https://registry.npmmirror.com/mqtt/5.10.1/files/dist/mqtt.min.js"></script>
		<!-- main.js 是 ES Module，其余模块由它 import，所以只需这一个入口 -->
		<script type="module" src="./js/main.js"></script>
	</body>
</html>
